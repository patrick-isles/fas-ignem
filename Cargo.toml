[package]
name = "fas-ignem"
version = "0.1.0"
edition = "2021"
authors = ["Patrick Isles <patrick.isles@pcc.edu>"]
description = "Fas – Ite, Maledicti, in Ignem Aeternum: A Liturgy of Irreversible Entropy and Sacred Hardware Transgression"
license = "MIT"

[dependencies]
libc = "0.2"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
